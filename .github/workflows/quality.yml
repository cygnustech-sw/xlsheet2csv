name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m build
      - name: Install wheel and smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          python -m venv /tmp/xlsheet2csv-wheel-test
          /tmp/xlsheet2csv-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/xlsheet2csv-wheel-test/bin/xlsheet2csv --version

  powershell:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -MinimumVersion 1.24.0 -Scope CurrentUser -Force
      - name: Validate module and scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Test-ModuleManifest ./powershell/Xlsheet2Csv/Xlsheet2Csv.psd1 | Out-Null
          Import-Module ./powershell/Xlsheet2Csv/Xlsheet2Csv.psd1 -Force
          $findings = @(Invoke-ScriptAnalyzer -Path ./powershell -Recurse -Severity Warning,Error)
          if ($findings) { $findings | Format-Table -AutoSize; throw "PSScriptAnalyzer returned $($findings.Count) finding(s)." }
